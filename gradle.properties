# Turtle Launcher (Amethyst foundation) — root Gradle properties
#
# This project merges the Amethyst-Android launcher core (AGP 9.x, Gradle 9.6.1,
# built-in-Kotlin-disabled DSL mode) with the Turtle Launcher Kotlin app layer.
# The flags below are the combination both sides need:
#  - android.newDsl=true / android.builtInKotlin=false: AGP 9.x new DSL (as upstream
    Amethyst uses) with the external org.jetbrains.kotlin.android plugin the Turtle
    layer requires (Room + kapt). Compat (old) DSL drops androidComponents.onVariants
#    built-in Kotlin support or allow the external org.jetbrains.kotlin.android
#    plugin that the Turtle layer requires (Room + kapt). We use the external plugin.
#  - Legacy resource/R flags kept from both sides (non-transitive R off, final res IDs
#    off) because both codebases rely on cross-package R references.

org.gradle.jvmargs=-Xmx4096M
org.gradle.configureondemand=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.tooling.parallel=true

android.useAndroidX=true
android.enableJetifier=true

# Ensure localizations aren't ruined
android.bundle.language.enableSplit=false

# We still use R for switch cases, so keep these options so they work
android.nonTransitiveRClass=false
android.nonFinalResIds=false
android.defaults.buildfeatures.resvalues=true

# Turtle Launcher identity (used by app_pojavlauncher/build.gradle)
launcher_name=TurtleLauncher
launcher_app_name=Turtle Launcher
launcher_version_code=400000
launcher_version_name=4.0.0.0

# AGP 9.x + external Kotlin plugin (see header comment)
android.newDsl=true
android.builtInKotlin=false
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false

# TurtleLauncher fix: Gradle's default HTTP timeouts (~30s) are too short for JitPack
# serving an unreleased master-SNAPSHOT coordinate (SkinViewAndroid) cold - it builds
# from source on first request and can take longer than that to respond, which was
# failing real Actions builds with a "Read timed out" resolving debugCompileClasspath.
# These are genuine Gradle-recognized system properties (consumed by its own HTTP
# transport for all Maven/Ivy repo access, JitPack included), not project-specific.
systemProp.http.connectionTimeout=120000
systemProp.http.socketTimeout=180000

# Run the Kotlin compiler inside the Gradle JVM instead of spawning a separate
# Kotlin daemon process - keeps peak memory lower on constrained CI runners.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
