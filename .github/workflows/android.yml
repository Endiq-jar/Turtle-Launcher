name: Android CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: "9.6.1"

      - name: Run scripts
        run: |
          ./scripts/languagelist_updater.sh
          mkdir -p out

      - name: Build Debug .apk
        run: |
          gradle :app_pojavlauncher:assembleDebug --stacktrace
          cp app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/turtle-launcher-debug.apk

      - name: Build Release .apk
        run: |
          gradle :app_pojavlauncher:assembleRelease --stacktrace
          cp app_pojavlauncher/build/outputs/apk/release/app_pojavlauncher-release-unsigned.apk out/turtle-launcher-release-unsigned.apk || \
          cp app_pojavlauncher/build/outputs/apk/release/app_pojavlauncher-release.apk out/turtle-launcher-release.apk

      - name: Generate checksums
        run: |
          cd out
          for f in *.apk; do
            md5sum "$f" > "$f.md5"
            sha256sum "$f" > "$f.sha256"
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: turtle-launcher-debug
          path: out/turtle-launcher-debug.apk*

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: turtle-launcher-release
          path: |
            out/turtle-launcher-release*.apk*
            !out/turtle-launcher-debug*
