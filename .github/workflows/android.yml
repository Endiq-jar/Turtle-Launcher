name: Android CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: "9.6.1"

      - name: Run scripts
        run: |
          ./scripts/languagelist_updater.sh
          mkdir -p out

      - name: Build Debug .apk
        run: |
          set -o pipefail
          gradle :app_pojavlauncher:assembleDebug --stacktrace 2>&1 | tee build-debug.log
          cp app_pojavlauncher/build/outputs/apk/debug/*.apk out/turtle-launcher-debug.apk

      - name: Report build errors
        if: failure()
        run: |
          # Emit ONE annotation per javac/kotlinc error group (error + symbol +
          # location + required/found merged onto a single line), so the 50-error
          # annotation cap carries complete information. Full log goes to the artifact.
          python3 - << 'PYEOF' > errors.log
          import re, sys
          lines = open('build-debug.log', encoding='utf-8', errors='replace').read().splitlines()
          group, out = [], []
          def flush():
              if group:
                  merged = ' | '.join(g.strip() for g in group)
                  out.append(merged[:600])
                  del group[:]
          for ln in lines:
              if re.match(r'^e: |error: ', ln) or re.search(r'\.(java|kt):[0-9]+: (error|�)', ln) or 'What went wrong' in ln or 'Caused by:' in ln or re.match(r'> Task .*FAILED', ln):
                  flush(); group.append(ln)
              elif group and re.match(r'^  (symbol|location|required|found):', ln):
                  group.append(ln)
              elif group and not ln.startswith(' '):
                  flush()
          flush()
          for o in out[:50]: print(o)
          PYEOF
          if [ -s errors.log ]; then
            while IFS= read -r line; do
              echo "::error::${line:0:600}"
            done < errors.log
          else
            echo "::error::Build failed but no error lines were matched; see full log"
            tail -60 build-debug.log | while IFS= read -r line; do echo "::error::${line:0:600}"; done
          fi
          # Keep the raw full-context log for the artifact as well
          grep -nE "^e: |error: |symbol: |location: |required:|found:|\.java:[0-9]+: |\.kt:[0-9]+: |What went wrong|Caused by:|> Task .*FAILED|FAILURE: Build failed" build-debug.log | head -400 > errors-raw.log || true

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-debug-failure-logs
          path: |
            build-debug.log
            errors.log
            errors-raw.log
          retention-days: 7

      - name: Build Release .apk
        if: success()
        run: |
          set -o pipefail
          gradle :app_pojavlauncher:assembleRelease --stacktrace 2>&1 | tee build-release.log
          cp app_pojavlauncher/build/outputs/apk/release/*.apk out/turtle-launcher-release.apk

      - name: Report release build errors
        if: failure()
        run: |
          grep -nE "^e: |error: |symbol: |location: |\.java:[0-9]+: |\.kt:[0-9]+: |What went wrong|Caused by:|> Task .*FAILED|FAILURE: Build failed" build-release.log 2>/dev/null | head -80 | while IFS= read -r line; do echo "::error::${line:0:600}"; done

      - name: Generate checksums
        if: success()
        run: |
          cd out
          for f in *.apk; do
            md5sum "$f" > "$f.md5"
            sha256sum "$f" > "$f.sha256"
          done

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: turtle-launcher-debug
          path: out/turtle-launcher-debug.apk*

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: turtle-launcher-release
          path: |
            out/turtle-launcher-release*.apk*
            !out/turtle-launcher-debug*
