name: Build patched Flame migration APK

on:
  push:
    branches:
      - arena/01a0be41-turtlelauncher
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-flame-migration:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out migration patches
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Flame build toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Apply complete pinned patch chain
        env:
          FLAME_WORKTREE: /tmp/turtle-flame-v220
        run: |
          chmod +x migration/build-flame.sh
          migration/build-flame.sh

      - name: Build patched Flame debug APK
        env:
          FLAME_WORKTREE: /tmp/turtle-flame-v220
        run: |
          set -o pipefail
          cd "$FLAME_WORKTREE"
          ./gradlew :app:assembleDebug --no-daemon 2>&1 | tee /tmp/flame-gradle-build.log

      - name: Print Gradle diagnostics
        if: always()
        run: |
          if [ -f /tmp/flame-gradle-build.log ]; then
            echo '--- last 300 Gradle log lines ---'
            tail -300 /tmp/flame-gradle-build.log
            {
              echo '## Flame Gradle diagnostics'
              echo '```text'
              tail -300 /tmp/flame-gradle-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload patched Flame APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: TurtleLauncher-flame-v220-debug-${{ github.sha }}
          path: /tmp/turtle-flame-v220/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: TurtleLauncher-flame-v220-diagnostics-${{ github.sha }}
          path: /tmp/flame-gradle-build.log
          if-no-files-found: ignore
