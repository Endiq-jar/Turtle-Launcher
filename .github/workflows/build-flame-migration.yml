name: Build patched Flame migration APK

on:
  push:
    branches:
      - arena/01a0be41-turtlelauncher
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-flame-migration:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out migration patches
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Flame build toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Apply patches and build patched Flame debug APK
        env:
          FLAME_WORKTREE: /tmp/turtle-flame-v220
        run: |
          chmod +x migration/build-flame.sh
          migration/build-flame.sh --build

      - name: Upload patched Flame APK
        uses: actions/upload-artifact@v6
        with:
          name: TurtleLauncher-flame-v220-debug-${{ github.sha }}
          path: /tmp/turtle-flame-v220/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
