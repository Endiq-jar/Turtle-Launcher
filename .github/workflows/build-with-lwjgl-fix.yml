name: Build with LWJGL 3.4.2 native fix

# Manual trigger only - this is a heavier build than the normal Auto Build
# (it cross-compiles LWJGL's native C core for Android arm64 first).
on:
  workflow_dispatch:
    inputs:
      publish_sdl_glfw:
        description: "Publish the auditable SDL GLFW 3.4.3+4 artifact instead of running the native build"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    if: ${{ !inputs.publish_sdl_glfw }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout TurtleLauncher
        uses: actions/checkout@v5
        with:
          path: turtle

      - name: Checkout MojoLauncher's LWJGL Android builder
        uses: actions/checkout@v5
        with:
          repository: MojoLauncher/unilwjgl3-builder
          path: builder

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # ci_build_all.bash clones LWJGL itself (at $LWJGL_VERSION) and applies
      # its own patches internally - it must be run from inside this checkout
      # so its relative ../patches/... paths resolve. Don't check out or patch
      # LWJGL separately; that just makes the script's own clone land in the
      # wrong place and breaks those relative paths (this is what failed last
      # run: "can't open patch '../patches/uni/*.diff'").
      - name: Run MojoLauncher's native build script (arm64 + others)
        working-directory: builder
        run: |
          git config --global core.autocrlf false
          export JAVA8_HOME=$JAVA_HOME_8_X64
          export LWJGL_VERSION='3.4.2'
          export LIBFFI_VERSION='3.7.0'
          bash ci_build_all.bash

      - name: Locate the new native libs
        run: |
          set -e
          echo "Searching for liblwjgl.so / liblwjgl_sdl.so under builder/lwjgl3/bin ..."
          find builder/lwjgl3/bin -type f \( -name "liblwjgl.so" -o -name "liblwjgl_sdl.so" \) -print

      - name: Copy arm64 native libs into TurtleLauncher
        run: |
          set -e
          mkdir -p turtle/TurtleLauncher/src/main/jniLibs/arm64-v8a
          found=0
          # Filter to paths that mention arm64/aarch64, since the script builds
          # all 4 Android arches - only arm64 is used by this app.
          while IFS= read -r f; do
            if echo "$f" | grep -qiE "arm64|aarch64"; then
              echo "Copying $f"
              cp "$f" turtle/TurtleLauncher/src/main/jniLibs/arm64-v8a/
              found=1
            fi
          done < <(find builder/lwjgl3/bin -type f \( -name "liblwjgl.so" -o -name "liblwjgl_sdl.so" \))
          if [ "$found" -eq 0 ]; then
            echo "::error::No arm64 liblwjgl.so/liblwjgl_sdl.so found - build output layout may differ from expected, check the 'Locate the new native libs' step above and adjust the path filter."
            exit 1
          fi
          ls -la turtle/TurtleLauncher/src/main/jniLibs/arm64-v8a/

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        working-directory: turtle
        run: chmod +x gradlew

      # Same reasoning as the existing Auto Build workflow: gradle.properties
      # pins aapt2 to a Termux-only path that doesn't exist on this runner.
      - name: Remove Termux-only aapt2 override for CI
        working-directory: turtle
        run: sed -i '/android.aapt2FromMavenOverride/d' gradle.properties

      - name: Build debug APK with the fixed native lib
        working-directory: turtle
        run: |
          ./gradlew :TurtleLauncher:assembleDebug \
            -Dkotlin.compiler.execution.strategy=in-process \
            -Dorg.gradle.jvmargs=-Xmx4g \
            --no-daemon

      - name: Upload fixed APK
        uses: actions/upload-artifact@v6
        with:
          name: TurtleLauncher-debug-apk-lwjgl-fixed
          path: turtle/TurtleLauncher/build/outputs/apk/debug/*.apk

  publish-sdl-glfw:
    if: ${{ inputs.publish_sdl_glfw }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download the signed upstream LWJGL 3.4.3 Java binding
        run: |
          set -eux
          mkdir -p release
          curl --fail --location --retry 5 \
            https://repo1.maven.org/maven2/org/lwjgl/lwjgl-glfw/3.4.3/lwjgl-glfw-3.4.3.jar \
            --output release/lwjgl-glfw-3.4.3-plus4.jar

      - name: Stamp the launcher-pinned coordinate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          source = Path("release/lwjgl-glfw-3.4.3-plus4.jar")
          temporary = source.with_suffix(".tmp")
          properties = b"artifactId=lwjgl-glfw\ngroupId=org.lwjgl\nversion=3.4.3+4\n"
          with zipfile.ZipFile(source, "r") as old, zipfile.ZipFile(temporary, "w", zipfile.ZIP_DEFLATED) as new:
              replaced = False
              for entry in old.infolist():
                  if entry.filename == "META-INF/maven/org.lwjgl/lwjgl-glfw/pom.properties":
                      new.writestr(entry, properties)
                      replaced = True
                  else:
                      new.writestr(entry, old.read(entry.filename))
              if not replaced:
                  new.writestr("META-INF/maven/org.lwjgl/lwjgl-glfw/pom.properties", properties)
          temporary.replace(source)
          PY
          sha256sum release/lwjgl-glfw-3.4.3-plus4.jar

      - name: Publish exact-version artifact
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sdl-glfw-3.4.3-4
          name: SDL GLFW 3.4.3+4
          body: |
            Auditable launcher-pinned Java-side GLFW artifact for Minecraft 26.3.
            The classes are the upstream LWJGL 3.4.3 release used by the 3.4.3
            core, repackaged with the 3.4.3+4 coordinate and metadata. It is
            intentionally a game-side artifact; the Android bridge contains no
            generated LWJGL callback classes.
          files: release/lwjgl-glfw-3.4.3-plus4.jar
          overwrite_files: true
