name: Build TurtleLauncher

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platforms;android-36
            build-tools;36.0.0
            ndk;27.0.12077973
            cmake;3.22.1

      - name: Build default Turtle target
        run: |
          chmod +x ./gradlew
          set +e
          ./gradlew :app:assembleDebug --no-daemon --no-configuration-cache 2>&1 | tee build-output.log
          build_status=${PIPESTATUS[0]}
          set -e
          if [ "$build_status" -ne 0 ]; then
            {
              echo "### Gradle build failure"
              echo
              echo '```text'
              tail -n 160 build-output.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            failure_summary=$(tail -n 35 build-output.log | tr '\r\n' ' ' | sed 's/%/%25/g; s/::/%3A%3A/g')
            echo "::error title=Gradle failure::$failure_summary"
            exit "$build_status"
          fi

      - name: Upload Turtle debug APK
        uses: actions/upload-artifact@v6
        with:
          name: TurtleLauncher-debug-apk
          path: app/build/outputs/apk/debug/*.apk
