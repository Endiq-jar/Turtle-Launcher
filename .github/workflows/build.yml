name: Build FlameLauncher

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platforms;android-36
            build-tools;36.0.0
            ndk;27.0.12077973
            cmake;3.22.1

      - name: Build default Flame target
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --no-configuration-cache

      - name: Upload Flame debug APK
        uses: actions/upload-artifact@v6
        with:
          name: FlameLauncher-debug-apk
          path: app/build/outputs/apk/debug/*.apk
