name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Works whether gradlew lives at the repo root or one level down
      # (e.g. TurtleLauncher/gradlew) - no need to hardcode the layout.
      - name: Locate the Android project root
        id: locate
        run: |
          GRADLEW_PATH=$(find . -maxdepth 3 -name gradlew | head -n1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "::error::No gradlew found anywhere in this repo (checked 3 levels deep)."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found Android project at: $PROJECT_DIR"

          PROPS="$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$PROPS" ]; then
            VERSION=$(grep -oE 'gradle-[0-9.]+-(bin|all)' "$PROPS" | head -n1 | sed -E 's/gradle-([0-9.]+)-(bin|all)/\1/')
          fi
          VERSION=${VERSION:-8.9}
          echo "gradle_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Target Gradle version: $VERSION"

      # Fixes: "Could not find or load main class org.gradle.wrapper.GradleWrapperMain"
      # That error means gradle/wrapper/gradle-wrapper.jar is missing, empty, or corrupt
      # in the repo - common with GitHub's web "Add files via upload" flow, which can
      # silently drop or mangle binary files. Rather than debug how it got lost, this
      # provisions a real Gradle install and has it write a fresh, correct wrapper jar
      # before gradlew is ever invoked, so the build no longer depends on whatever
      # actually made it into the repo.
      - name: Provision Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ steps.locate.outputs.gradle_version }}

      - name: Regenerate the Gradle wrapper jar
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle wrapper --gradle-version ${{ steps.locate.outputs.gradle_version }}

      # The Termux build pins aapt2 to a Termux-only ARM64 binary path that doesn't
      # exist on a normal Linux runner. Strip it so AGP falls back to the standard
      # aapt2 pulled from Google's Maven repo. Harmless no-op if the line isn't there.
      - name: Remove Termux-only aapt2 override
        run: sed -i '/android.aapt2FromMavenOverride/d' "${{ steps.locate.outputs.dir }}/gradle.properties" || true

      - name: Grant execute permission to gradlew
        run: chmod +x "${{ steps.locate.outputs.dir }}/gradlew"

      - name: Regenerate LWJGL bridge payload
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          set -o pipefail
          ./gradlew :jre_lwjgl3glfw:bridgeJar --no-daemon --no-configuration-cache --stacktrace --info 2>&1 | tee bridge-build.log

      - name: Commit regenerated LWJGL bridge payload
        if: success() && github.event_name == 'pull_request'
        working-directory: ${{ steps.locate.outputs.dir }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TurtleLauncher/src/main/assets/components/lwjgl3/lwjgl-glfw-bridge.jar \
            TurtleLauncher/src/main/assets/components/lwjgl3/lwjgl-glfw-classes.jar
          if git diff --cached --quiet; then
            echo "Generated bridge payload is already current."
            exit 0
          fi
          git commit -m "Regenerate LWJGL bridge payload [skip ci]"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Report bridge build diagnostics
        if: failure()
        working-directory: ${{ steps.locate.outputs.dir }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### LWJGL bridge regeneration diagnostics'
            echo '```text'
            tail -300 bridge-build.log
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY" > bridge-diagnostics.md
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gh pr comment "${{ github.event.pull_request.number }}" \
              --repo "${{ github.repository }}" \
              --body-file bridge-diagnostics.md || true
          fi

      - name: Upload bridge build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lwjgl-glfw-bridge-build-log
          path: "bridge-build.log"

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: ./gradlew :TurtleLauncher:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: TurtleLauncher-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"

      - name: Upload generated LWJGL bridge
        uses: actions/upload-artifact@v6
        with:
          name: lwjgl-glfw-bridge
          path: "TurtleLauncher/src/main/assets/components/lwjgl3/lwjgl-glfw-bridge.jar"
