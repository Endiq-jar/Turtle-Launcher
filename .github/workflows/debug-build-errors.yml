name: Debug Build Errors (TEMPORARY)

# Temporary diagnostics: runs the same assembleDebug as Build APK, but captures
# the log and re-emits the failure summary as workflow annotations (the normal
# build log host is unreachable from the dev sandbox, so errors are invisible).
# Triggered only by pushes touching .debug-trigger. DELETE AFTER USE.

on:
  push:
    paths:
      - '.debug-trigger'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Provision Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.4.1'

      - name: Regenerate the Gradle wrapper jar
        run: gradle wrapper --gradle-version 9.4.1

      - name: Remove Termux-only aapt2 override
        run: sed -i '/android.aapt2FromMavenOverride/d' gradle.properties || true

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build debug APK (captured)
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          ./gradlew :TurtleLauncher:assembleDebug --no-daemon > /tmp/build.log 2>&1
          echo "GRADLE_EXIT=$?" >> "$GITHUB_ENV"

      - name: Surface errors as annotations
        if: always()
        run: |
          {
            echo "===== GRADLE EXIT: ${GRADLE_EXIT:-unknown} ====="
            echo "===== What went wrong ====="
            awk '/What went wrong\?/{flag=1} flag{print} /^\* Try:/{if(flag) exit}' /tmp/build.log | head -n 60
            echo "===== FAILED tasks ====="
            grep -E "^> Task .* FAILED|FAILED$" /tmp/build.log | sort -u | head -n 20
            echo "===== error lines ====="
            grep -E "error:|warning: .*\.java|e: .*\.kt|\.java:[0-9]+:" /tmp/build.log | sort -u | head -n 40
          } > /tmp/errs.txt 2>&1 || true
          while IFS= read -r line; do
            line="$(echo "$line" | head -c 900)"
            echo "::error::$line"
          done < /tmp/errs.txt
          if [ "${GRADLE_EXIT:-1}" != "0" ]; then exit 1; fi
