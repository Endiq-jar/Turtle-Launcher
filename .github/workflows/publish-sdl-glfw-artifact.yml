name: Publish SDL GLFW artifact

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download the signed upstream LWJGL 3.4.3 Java binding
        run: |
          set -eux
          mkdir -p release
          curl --fail --location --retry 5 \
            https://repo1.maven.org/maven2/org/lwjgl/lwjgl-glfw/3.4.3/lwjgl-glfw-3.4.3.jar \
            --output release/lwjgl-glfw-3.4.3-plus4.jar

      - name: Stamp the launcher-pinned coordinate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          source = Path("release/lwjgl-glfw-3.4.3-plus4.jar")
          temporary = source.with_suffix(".tmp")
          properties = b"artifactId=lwjgl-glfw\ngroupId=org.lwjgl\nversion=3.4.3+4\n"
          with zipfile.ZipFile(source, "r") as old, zipfile.ZipFile(temporary, "w", zipfile.ZIP_DEFLATED) as new:
              replaced = False
              for entry in old.infolist():
                  if entry.filename == "META-INF/maven/org.lwjgl/lwjgl-glfw/pom.properties":
                      new.writestr(entry, properties)
                      replaced = True
                  else:
                      new.writestr(entry, old.read(entry.filename))
              if not replaced:
                  new.writestr("META-INF/maven/org.lwjgl/lwjgl-glfw/pom.properties", properties)
          temporary.replace(source)
          PY
          sha256sum release/lwjgl-glfw-3.4.3-plus4.jar

      - name: Publish exact-version artifact
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sdl-glfw-3.4.3-4
          name: SDL GLFW 3.4.3+4
          body: |
            Auditable launcher-pinned Java-side GLFW artifact for Minecraft 26.3.
            The classes are the upstream LWJGL 3.4.3 release used by the 3.4.3
            core, repackaged with the 3.4.3+4 coordinate and metadata. It is
            intentionally a game-side artifact; the Android bridge contains no
            generated LWJGL callback classes.
          files: release/lwjgl-glfw-3.4.3-plus4.jar
          overwrite_files: true
